<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="/property-house.svg">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999999;
    }

    #loader {
      display: block;
      position: relative;
      left: 50%;
      top: 50%;
      width: 150px;
      height: 150px;
      margin: -75px 0 0 -75px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #FFF;
      -webkit-animation: spin 2s linear infinite;
      -ms-animation: spin 2s linear infinite;
      -moz-animation: spin 2s linear infinite;
      -o-animation: spin 2s linear infinite;
      animation: spin 2s linear infinite;
      z-index: 1001;
    }

    #loader:before {
      content: "";
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      bottom: 5px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #FFF;
      -webkit-animation: spin 3s linear infinite;
      -moz-animation: spin 3s linear infinite;
      -o-animation: spin 3s linear infinite;
      -ms-animation: spin 3s linear infinite;
      animation: spin 3s linear infinite;
    }

    #loader:after {
      content: "";
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #FFF;
      -moz-animation: spin 1.5s linear infinite;
      -o-animation: spin 1.5s linear infinite;
      -ms-animation: spin 1.5s linear infinite;
      -webkit-animation: spin 1.5s linear infinite;
      animation: spin 1.5s linear infinite;
    }


    @-webkit-keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
        -ms-transform: rotate(0deg);
        transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
        -ms-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }

    @keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
        -ms-transform: rotate(0deg);
        transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
        -ms-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }


    #loader-wrapper .loader-section {
      position: fixed;
      top: 0;
      width: 51%;
      height: 100%;
      background: #7171C6;
      z-index: 1000;
      -webkit-transform: translateX(0);
      -ms-transform: translateX(0);
      transform: translateX(0);
    }

    #loader-wrapper .loader-section.section-left {
      left: 0;
    }

    #loader-wrapper .loader-section.section-right {
      right: 0;
    }


    .loaded #loader-wrapper .loader-section.section-left {
      -webkit-transform: translateX(-100%);
      -ms-transform: translateX(-100%);
      transform: translateX(-100%);
      -webkit-transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1.000);
      transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1.000);
    }

    .loaded #loader-wrapper .loader-section.section-right {
      -webkit-transform: translateX(100%);
      -ms-transform: translateX(100%);
      transform: translateX(100%);
      -webkit-transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1.000);
      transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1.000);
    }

    .loaded #loader {
      opacity: 0;
      -webkit-transition: all 0.3s ease-out;
      transition: all 0.3s ease-out;
    }

    .loaded #loader-wrapper {
      visibility: hidden;
      -webkit-transform: translateY(-100%);
      -ms-transform: translateY(-100%);
      transform: translateY(-100%);
      -webkit-transition: all 0.3s 1s ease-out;
      transition: all 0.3s 1s ease-out;
    }

    .no-js #loader-wrapper {
      display: none;
    }

    .no-js h1 {
      color: #222222;
    }

    #loader-wrapper .load_title {
      font-family: 'Open Sans';
      color: #FFF;
      font-size: 19px;
      width: 100%;
      text-align: center;
      z-index: 9999999999999;
      position: absolute;
      top: 60%;
      opacity: 1;
      line-height: 30px;
    }

    #loader-wrapper .load_title span {
      font-weight: normal;
      font-style: italic;
      font-size: 13px;
      color: #FFF;
      opacity: 0.5;
    }

    /* 物业主题启动动画：用房屋、窗户和环形服务轨迹替代通用旋转圈。 */
    #loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(135deg, #0b6f73 0%, #0f9d9a 48%, #38bdf8 100%);
      overflow: hidden;
    }

    #loader-wrapper::before,
    #loader-wrapper::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(236, 254, 255, 0.22);
      border-radius: 50%;
      pointer-events: none;
    }

    #loader-wrapper::before {
      width: 52vw;
      height: 52vw;
      animation: loaderWave 5s ease-in-out infinite;
    }

    #loader-wrapper::after {
      width: 78vw;
      height: 78vw;
      animation: loaderWave 7s ease-in-out infinite reverse;
    }

    #loader-wrapper .loader-section {
      display: none;
    }

    #loader.property-loader {
      position: relative;
      left: auto;
      top: auto;
      width: 148px;
      height: 148px;
      margin: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 18px 55px rgba(5, 55, 66, 0.28), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
      animation: loaderFloat 2.8s ease-in-out infinite;
      z-index: 1001;
    }

    #loader.property-loader::before,
    #loader.property-loader::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px solid transparent;
      border-top-color: rgba(236, 254, 255, 0.96);
      border-right-color: rgba(236, 254, 255, 0.35);
      border-radius: 50%;
      animation: loaderOrbit 1.9s linear infinite;
    }

    #loader.property-loader::after {
      inset: 20px;
      border-top-color: rgba(253, 230, 138, 0.95);
      border-right-color: rgba(253, 230, 138, 0.25);
      animation-duration: 1.35s;
      animation-direction: reverse;
    }

    .loader-house {
      position: absolute;
      inset: 35px;
      width: 78px;
      height: 78px;
      animation: loaderHouse 2.8s ease-in-out infinite;
    }

    #loader-wrapper .load_title {
      position: relative;
      top: auto;
      width: auto;
      color: #fff;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(5, 55, 66, 0.2);
      z-index: 1001;
    }

    #loader-wrapper .load_subtitle {
      margin-top: -10px;
      color: rgba(236, 254, 255, 0.86);
      font-size: 13px;
      letter-spacing: 1px;
      z-index: 1001;
    }

    .loader-dots {
      display: flex;
      gap: 7px;
      z-index: 1001;
    }

    .loader-dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fef3c7;
      animation: loaderDot 1.2s ease-in-out infinite;
    }

    .loader-dots i:nth-child(2) { animation-delay: 0.16s; }
    .loader-dots i:nth-child(3) { animation-delay: 0.32s; }

    @keyframes loaderOrbit {
      to { transform: rotate(360deg); }
    }

    @keyframes loaderFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes loaderHouse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes loaderDot {
      0%, 100% { transform: translateY(0); opacity: 0.45; }
      50% { transform: translateY(-5px); opacity: 1; }
    }

    @keyframes loaderWave {
      0%, 100% { transform: scale(0.96); opacity: 0.35; }
      50% { transform: scale(1.04); opacity: 0.7; }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <div id="loader" class="property-loader" aria-label="物业服务加载中">
        <svg class="loader-house" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 30.5L32 13L52 30.5V50C52 51.1046 51.1046 52 50 52H14C12.8954 52 12 51.1046 12 50V30.5Z" fill="#ECFEFF"/>
          <path d="M8.5 30.5L32 10L55.5 30.5L51.6 34L32 16.9L12.4 34L8.5 30.5Z" fill="#0B6F73"/>
          <rect x="27" y="38" width="10" height="14" rx="1.5" fill="#0B6F73"/>
          <rect x="19" y="32" width="7" height="7" rx="1" fill="#38BDF8"/>
          <rect x="38" y="32" width="7" height="7" rx="1" fill="#38BDF8"/>
          <circle cx="34.5" cy="45" r="1" fill="#FDE68A"/>
        </svg>
      </div>
      <div class="load_title">正在准备物业服务</div>
      <div class="load_subtitle">加载小区报修资源，请稍候</div>
      <div class="loader-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
